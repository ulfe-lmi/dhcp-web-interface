name: CI

on:
  pull_request:
  push:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install backend dependencies
        working-directory: apps/server
        run: uv sync --extra dev --locked

      - name: Run backend Django tests
        working-directory: apps/server
        run: uv run pytest

      - name: Check backend migrations
        working-directory: apps/server
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply backend migrations
        working-directory: apps/server
        run: uv run python manage.py migrate --noinput

      - name: Run device gateway Go tests
        working-directory: services/device-gateway
        run: go test ./...

      - name: Run edge agent Go tests
        working-directory: edge/agent
        run: go test ./...

      - name: Run apply helper Go tests
        working-directory: edge/apply-helper
        run: go test ./...

      - name: Validate JSON schema parses
        run: python -m json.tool schemas/config-artifact.schema.json >/dev/null
