name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scaffold:
    name: Scaffold Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run Python placeholder tests
        working-directory: apps/server
        run: python -m pytest

      - name: Run device gateway Go tests
        working-directory: services/device-gateway
        run: go test ./...

      - name: Run edge agent Go tests
        working-directory: edge/agent
        run: go test ./...

      - name: Run apply helper Go tests
        working-directory: edge/apply-helper
        run: go test ./...

      - name: Validate JSON schema parses
        run: python -m json.tool schemas/config-artifact.schema.json >/dev/null
